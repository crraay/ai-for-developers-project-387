name: todo-fixme-audit

# Daily audit of TODO/FIXME (and HACK/XXX/CHANGEME) markers. Runs once a day on
# a schedule (00:00 UTC+7) and on demand via workflow_dispatch.
#
# Each run:
#   - saves the raw data (report, agent log, context) as a workflow artifact;
#   - publishes a one-line run summary (finding count, filed issues, run link)
#     as a comment on the stable "Scheduled audit reports" issue;
#   - files one `audit-finding` issue per untracked finding, with the problem,
#     the proposed action, the app name and the run/report link.
#
# Before filing, the agent searches all existing issues (open and closed), so a
# repeat run with the same finding does not create a duplicate. A finding that
# is already covered by an open or closed issue is reported as tracked, not
# filed again.
#
# A manual run may pass `training_finding`. The agent treats that text as an
# explicitly labelled TRAINING finding, files one `training`-labelled issue,
# and states in the body that it is not a confirmed application defect. This
# demonstrates the write path without inventing a real bug in the app.
#
# Authorization follows the `use_github_token` path rather than the OpenCode
# App/OIDC path: the job's GITHUB_TOKEN is handed to the agent as GH_TOKEN and
# the job asks for `issues: write`, the narrowest scope that can create the
# finding issues, the run-summary comment and the labels. `contents` stays
# read-only, so the agent cannot change code, releases or secrets. The model
# key (OPENCODE_API_KEY) is read only by the provider preflight and the agent
# step.
#
# The pinned github action is not used here: for schedule/workflow_dispatch it
# checks out a throwaway branch and, when the worktree is dirty, pushes it and
# opens a PR; otherwise it only logs the answer. Instead the opencode CLI is
# installed and run directly (`opencode run`), which writes the final answer to
# stdout and its own logs to stderr, so the report is captured deterministically.
#
# Reports live in the gitignored `.audit/` directory: they are uploaded as an
# artifact and never committed.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 UTC+7
  workflow_dispatch:
    inputs:
      training_finding:
        description: "Optional training text; files a labelled training issue, not a real defect"
        required: false
        type: string

# Deny every token permission by default; the job asks for the two it needs.
permissions: {}

# One audit at a time. A run that overlaps a previous one queues behind it
# instead of working concurrently, and an in-flight run is never cancelled (its
# report would be lost while the run is gone).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max # keep every scheduled or manual audit, not only the last pending one

jobs:
  audit:
    if: vars.OPENCODE_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout of this repository
      issues: write # finding issues, the run-summary comment and audit labels
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # opencode.json reads the Render MCP token from .render-api-key, a
      # gitignored local secret. The config is rejected while that file is
      # missing, so create an empty placeholder (same as opencode.yml); the
      # agent has no Render key and a failed MCP connection does not stop a run.
      - name: Provide the local config's secret file placeholder
        run: touch .render-api-key

      - name: Record the audit date
        id: date
        run: echo "today=$(date -u -d '+7 hours' +%F)" >> "$GITHUB_OUTPUT"

      # Provider quota is account-wide. A skipped audit still records itself:
      # the denial below writes the artifact the upload step expects.
      - name: Check provider quota
        id: preflight
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          QUOTA_PERCENT: ${{ vars.OPENCODE_PROVIDER_QUOTA_PERCENT || 95 }}
        run: node scripts/opencode-preflight.mjs --provider

      - name: Record the provider refusal
        if: steps.preflight.outputs.allowed == 'false'
        env:
          REASON: ${{ steps.preflight.outputs.reason }}
          QUOTA: ${{ steps.preflight.outputs.quota }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .audit
          {
            echo '## TODO/FIXME audit did not run'
            echo
            printf '%s\n' "${REASON:-the provider quota check did not allow this audit}"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Run: ${RUN_URL}"
            if [ -n "${QUOTA:-}" ]; then
              echo "- Provider quota: ${QUOTA}"
            fi
          } | tee .audit/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::${REASON:-the provider quota check did not allow this audit}"

      # Same install path as the pinned action, without its event-driven runner.
      - name: Install opencode
        if: steps.preflight.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Create the labels and the stable report issue once, then leave the run
      # URL, date and report-issue number in .audit/ for the agent to read. The
      # agent cannot use shell variables, so the values are files.
      - name: Prepare the audit context
        id: context
        if: steps.preflight.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAINING_FINDING: ${{ inputs.training_finding }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_DATE: ${{ steps.date.outputs.today }}
        run: |
          set -euo pipefail
          mkdir -p .audit
          printf '%s\n' "$RUN_URL" > .audit/run-url
          printf '%s\n' "$AUDIT_DATE" > .audit/audit-date
          if [ -n "${TRAINING_FINDING:-}" ]; then
            printf '%s\n' "$TRAINING_FINDING" > .audit/training-finding.txt
          fi

          gh label create audit-finding --color 5319E7 \
            --description "Finding from a scheduled audit" --force
          gh label create audit-report --color 0E8A16 \
            --description "Scheduled audit run reports" --force
          gh label create training --color FBCA04 \
            --description "Training demonstration, not a confirmed defect" --force

          # Reuse the issue by its exact title, not by label alone: a second
          # labelled issue or a closed report issue must not silently move the
          # run summaries. Reopen a closed report issue before commenting.
          report_issue="$(gh issue list --state all --limit 10 \
            --search "Scheduled audit reports in:title" \
            --json number,title \
            --jq '[.[] | select(.title == "Scheduled audit reports")][0].number // empty')"
          if [ -z "$report_issue" ]; then
            report_url="$(gh issue create --title "Scheduled audit reports" \
              --label audit-report \
              --body "Run reports for the scheduled audits. Each run adds one comment with its finding count and run link; each new finding gets its own issue.")"
            report_issue="${report_url##*/}"
          else
            report_state="$(gh issue view "$report_issue" --json state --jq .state)"
            if [ "$report_state" = "CLOSED" ]; then
              gh issue reopen "$report_issue"
            fi
          fi
          printf '%s\n' "$report_issue" > .audit/report-issue
          echo "report-issue=${report_issue}" >> "$GITHUB_OUTPUT"

      - name: Audit with OpenCode
        id: agent
        if: steps.preflight.outputs.allowed == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # The job's GITHUB_TOKEN carries only `issues: write` on top of
          # `contents: read`. Naming it GH_TOKEN is what makes `gh` pick it up.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Anything that would prompt is denied: a prompt cannot be answered on
          # a runner. Shape is opencode's V1 `permission` object (the installed
          # binary), merged over opencode.json. The last matching key wins, so
          # the wildcard comes first and the guards come last.
          OPENCODE_PERMISSION: |
            {
              "edit": "deny",
              "write": "deny",
              "read": {
                "*": "allow",
                "*.env": "deny",
                "*.env.*": "deny"
              },
              "external_directory": "deny",
              "question": "deny",
              "task": "deny",
              "todowrite": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "bash": {
                "*": "deny",
                "gh issue list": "allow",
                "gh issue list *": "allow",
                "gh issue view *": "allow",
                "gh search issues *": "allow",
                "gh issue create": "allow",
                "gh issue create *": "allow",
                "gh issue comment": "allow",
                "gh issue comment *": "allow",
                "*>*": "deny",
                "*<*": "deny",
                "*;*": "deny",
                "*&&*": "deny",
                "*&*": "deny",
                "*|*": "deny",
                "*$*": "deny",
                "*`*": "deny",
                "*\n*": "deny",
                "*\r*": "deny"
              }
            }
        run: |
          set -euo pipefail
          opencode run --model opencode-go/deepseek-v4.1-flash \
            > .audit/report.md 2> .audit/agent.log <<'PROMPT'
          You are running a scheduled TODO/FIXME audit in this repository. Your
          job is to produce a Markdown report and publish its outcome; do not
          change code.

          Read these files first with the read tool (relative to the repo root):
            - .audit/run-url            — the URL of this workflow run.
            - .audit/audit-date         — the audit date (UTC+7).
            - .audit/report-issue       — the number of the stable
                                          "Scheduled audit reports" issue.
            - .audit/training-finding.txt — present only for the training demo.

          A finding is a TODO, FIXME, HACK, XXX or CHANGEME marker that lives in
          hand-written source and reads like a task note or code comment, for
          example a source comment that starts with TODO: or FIXME:. A sentence
          in documentation that merely lists the marker names, a table heading,
          or this prompt is not a finding. Markers in generated, vendored or
          build output are skipped, not reported.

          1. Find every finding using the grep tool. Skip generated, vendored
             and build output: node_modules/, frontend/node_modules/, build/,
             dist/, target/, .gradle/, openapi/api.yml, frontend/src/api/,
             .git/, and lockfiles. Skip this workflow file itself if the only
             matches are its own comments.

          2. For each finding, note the file, the line and the marker text.

          3. Cross-reference each finding against the existing issues using
             only these read commands, via bash. The shell whitelist denies |,
             $, backticks, ;, &, angle brackets, double quotes, backslashes,
             redirects and newlines; run the commands as written, without
             pipes or --jq filters:
               gh issue list --state all
               gh issue list --state all --search "TEXT"
               gh issue view NUMBER
               gh search issues "TEXT"
             Use a short plain search token (letters, digits, spaces and
             hyphens) in TEXT, not the raw marker text. A finding is "tracked"
             when an existing issue (open or closed) clearly covers it, and
             "untracked" otherwise. Do not create a second issue for a tracked
             finding.

          4. For each untracked finding, create ONE issue. Replace every
             UPPERCASE placeholder with real text and keep the whole command
             on one line. Strip backticks, angle brackets, dollar signs,
             semicolons, ampersands, pipes, double quotes, backslashes and
             newlines from marker text (replace them with spaces) rather than
             refusing to file the issue:
               gh issue create --title "Scheduled audit finding: SHORT TITLE" --label audit-finding --body "App: Call Calendar. Problem: WHAT AND WHERE. Proposed action: WHAT A HUMAN SHOULD DO. Report: RUN URL (artifact: todo-fixme-audit-DATE). Filed by the scheduled TODO/FIXME audit. A human decides whether to act on it."

          5. If .audit/training-finding.txt exists and is not empty, treat its
             content as an explicitly labelled TRAINING finding, not a real
             defect. Search with a short plain token from the training text
             first, and apply the same character rules to the body. If no
             matching issue exists, create ONE issue:
               gh issue create --title "Training audit finding: SHORT TITLE" --label training --body "TRAINING — not a confirmed application defect. App: Call Calendar. Problem: TRAINING TEXT. Proposed action: demonstrate the audit's issue-filing path. No code change is requested. Report: RUN URL. This issue is a training artifact only."
             If an issue with the same training text already exists, do not
             create another one.

          6. Publish the run summary as a comment on the report issue. Replace
             REPORT_ISSUE with the number from .audit/report-issue, and keep
             the comment on one line, free of pipes, double quotes,
             backslashes and newlines:
               gh issue comment REPORT_ISSUE --body "TODO/FIXME audit DATE: N markers (tracked T, untracked U). Filed: ISSUE NUMBERS OR none. Result: SHORT OUTCOME. Run: RUN URL"
             For a zero-finding run use:
               gh issue comment REPORT_ISSUE --body "TODO/FIXME audit DATE: 0 markers. No new issue. Run: RUN URL"

          7. Return a Markdown report as your final answer:

             ## TODO/FIXME audit
             **Markers found:** <n> (tracked: <t>, untracked: <u>)

             | File | Line | Marker | Status |
             |---|---|---|---|
             | path/to/file | 12 | `TODO: ...` | tracked in #123 / filed #124 |

             Then a short "Published" section naming the report-issue comment
             and every issue you created. If there are no findings at all,
             return exactly:

             ## TODO/FIXME audit
             **Markers found:** 0

             No TODO/FIXME/HACK/XXX/CHANGEME markers found in the repository.

          Do not edit, write, create or modify any file, pull request or
          comment other than the issues and the one report comment described
          above. Do not use the web.
          PROMPT
          if [ ! -s .audit/report.md ]; then
            printf 'No TODO/FIXME report produced.\n' > .audit/report.md
          fi

      # Always upload: the report, the agent log, the run URL and the context
      # files are the audit's raw data. The upload survives a later step
      # failure because it is gated on `!cancelled()`, not `success()`.
      - name: Upload the audit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo-fixme-audit-${{ steps.date.outputs.today || 'unknown' }}
          path: .audit/
          # `.audit` is a dot-directory; upload-artifact skips hidden paths
          # unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
