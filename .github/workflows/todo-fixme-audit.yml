name: todo-fixme-audit

# Daily audit of TODO/FIXME (and HACK/XXX/CHANGEME) markers. Runs once a day on
# a schedule (00:00 UTC+7) and on demand via workflow_dispatch.
#
# The audit is read-only: the agent greps the tree, cross-references each marker
# against the existing open issues, and returns a Markdown report. The report is
# uploaded as a workflow artifact — never committed and never filed as an issue —
# so a run with no findings still records itself. No code is edited and no pull
# request is opened.
#
# The pinned github action is not used here: for schedule/workflow_dispatch it
# checks out a throwaway branch and, when the worktree is dirty, pushes it and
# opens a PR; otherwise it only logs the answer. That cannot "save the result
# even without findings". Instead the opencode CLI is installed and run directly
# (`opencode run`), which writes the final answer to stdout and its own logs to
# stderr, so the report is captured deterministically.
#
# Authorization mirrors opencode.yml: the model key (OPENCODE_API_KEY) is read
# only by the provider preflight and the agent step; the job's GITHUB_TOKEN
# stays read-only and is what the agent uses to search issues. No write-capable
# token is needed, because the report is an artifact, not a commit or an issue.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 UTC+7
  workflow_dispatch:

# Deny every token permission by default; the job asks for the two it needs.
permissions: {}

# One audit at a time. A run that overlaps a previous one queues behind it
# instead of working concurrently, and an in-flight run is never cancelled (its
# report would be lost while the run is gone).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max # keep every scheduled or manual audit, not only the last pending one

jobs:
  audit:
    if: vars.OPENCODE_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout of this repository
      issues: read # gh issue list / gh search issues in the agent step
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # opencode.json reads the Render MCP token from .render-api-key, a
      # gitignored local secret. The config is rejected while that file is
      # missing, so create an empty placeholder (same as opencode.yml); the
      # agent has no Render key and a failed MCP connection does not stop a run.
      - name: Provide the local config's secret file placeholder
        run: touch .render-api-key

      - name: Record the audit date
        id: date
        run: echo "today=$(date -u -d '+7 hours' +%F)" >> "$GITHUB_OUTPUT"

      # Provider quota is account-wide. A skipped audit still records itself:
      # the denial below writes the artifact the upload step expects.
      - name: Check provider quota
        id: preflight
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          QUOTA_PERCENT: ${{ vars.OPENCODE_PROVIDER_QUOTA_PERCENT || 95 }}
        run: node scripts/opencode-preflight.mjs --provider

      - name: Record the provider refusal
        if: steps.preflight.outputs.allowed == 'false'
        env:
          REASON: ${{ steps.preflight.outputs.reason }}
          QUOTA: ${{ steps.preflight.outputs.quota }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          {
            echo '## TODO/FIXME audit did not run'
            echo
            printf '%s\n' "${REASON:-the provider quota check did not allow this audit}"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Run: ${RUN_URL}"
            if [ -n "${QUOTA:-}" ]; then
              echo "- Provider quota: ${QUOTA}"
            fi
          } | tee "$tmp/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::${REASON:-the provider quota check did not allow this audit}"

      # Same install path as the pinned action, without its event-driven runner.
      - name: Install opencode
        if: steps.preflight.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Audit with OpenCode
        id: agent
        if: steps.preflight.outputs.allowed == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Read-only token for the whitelisted `gh` calls. Naming it GH_TOKEN
          # is what makes `gh` pick it up; the job's GITHUB_TOKEN cannot write.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Anything that would prompt is denied: a prompt cannot be answered on
          # a runner. Shape is opencode's V1 `permission` object (the installed
          # binary), merged over opencode.json. The last matching key wins, so
          # the wildcard comes first and the guards come last.
          OPENCODE_PERMISSION: |
            {
              "edit": "deny",
              "write": "deny",
              "read": {
                "*": "allow",
                "*.env": "deny",
                "*.env.*": "deny"
              },
              "external_directory": "deny",
              "question": "deny",
              "task": "deny",
              "todowrite": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "bash": {
                "*": "deny",
                "gh issue list": "allow",
                "gh issue list *": "allow",
                "gh issue view *": "allow",
                "gh search issues *": "allow",
                "*>*": "deny",
                "*<*": "deny",
                "*;*": "deny",
                "*&&*": "deny",
                "*&*": "deny",
                "*|*": "deny",
                "*$*": "deny",
                "*`*": "deny",
                "*\n*": "deny",
                "*\r*": "deny"
              }
            }
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          opencode run --model opencode-go/deepseek-v4.1-flash \
            > "$tmp/report.md" 2> "$tmp/agent.log" <<'PROMPT'
          You are running a scheduled TODO/FIXME audit in this repository. Your
          job is read-only: produce a Markdown report and nothing else.

          A finding is a TODO, FIXME, HACK, XXX or CHANGEME marker that lives in
          hand-written source. Markers in generated, vendored or build output are
          skipped, not reported.

          1. Find every finding using the grep tool. Skip generated, vendored
             and build output: node_modules/, frontend/node_modules/, build/,
             dist/, target/, .gradle/, openapi/api.yml, frontend/src/api/,
             .git/, and lockfiles. Skip this workflow file itself if the only
             matches are its own comments.
          2. For each finding, note the file, the line and the marker text.
          3. Cross-reference each finding against the existing issues using only
             these read commands, via bash (keep the --jq filters free of ">"
             and "<"):
               gh issue list --state open
               gh issue list --search "<text>"
               gh issue view <number>
               gh search issues "<text>"
             A finding is "tracked" when an open issue clearly covers it, and
             "untracked" otherwise. Do not create or edit any issue.
          4. Return a Markdown report. The workflow saves your answer as the
             todo-fixme-audit artifact (nothing is committed):

             ## TODO/FIXME audit
             **Markers found:** <n> (tracked: <t>, untracked: <u>)

             | File | Line | Marker | Status |
             |---|---|---|---|
             | path/to/file | 12 | `TODO: ...` | tracked in #123 / untracked |

             Then a short "Notes" section with anything worth a human's
             attention.

          If there are no findings at all, return exactly:

             ## TODO/FIXME audit
             **Markers found:** 0

             No TODO/FIXME/HACK/XXX/CHANGEME markers found in the repository.

          Return only the report as your final answer. Do not edit, write,
          create or modify any file, issue, pull request or comment, and do not
          use the web. The report is captured from your answer and uploaded as a
          workflow artifact.
          PROMPT
          if [ ! -s "$tmp/report.md" ]; then
            printf 'No TODO/FIXME markers reported.\n' > "$tmp/report.md"
          fi

      # The report is an artifact, not a commit or an issue, so no write-capable
      # token is needed. The denial branch above writes the report when the
      # provider check stops the run; the agent branch writes it on success.
      - name: Upload the report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo-fixme-audit-${{ steps.date.outputs.today }}
          path: ${{ runner.temp }}/report.md
          if-no-files-found: error
          retention-days: 90
