name: opencode-review

# Every non-draft pull request authored by the repository owner or
# `opencode-agent[bot]`, from a branch in this repository, is reviewed by the
# OpenCode agent when it is opened, pushed to, reopened or made ready. The
# review is advisory: it is not a required check and a failed run never fails
# the pull request.
#
# The pinned github action is not used here: for a pull_request event it asserts
# the triggering actor's collaborator permission before posting, and the App
# bot that authors the implement PRs (`opencode-agent[bot]`) has
# `permission: none`, so the action refuses to post its review. The CLI is
# installed and run directly instead (`opencode run`), which writes the answer
# to stdout; the review is then posted through an explicit OIDC App-token
# exchange, exactly as opencode.yml does, so this workflow's own GITHUB_TOKEN
# stays read-only. Migrating off the removed action is also tracked in #12 and
# #54.
#
# The agent is read-only: `edit` is denied so the worktree cannot go dirty, the
# web is denied, and `bash` is a read-only whitelist. A review posts a new
# comment on every push (#55).
#
# `preflight` is the account-wide provider quota check plus the per-PR review
# attempt budget. It has no write token and runs only for a same-repository PR,
# so a fork never reaches it. `refuse` posts the reason, head SHA and run link
# without the model key. The review job therefore starts only when both checks
# allow it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# The run name is the budget ledger key. It is stable across re-runs and
# pushes; skipped draft/fork runs are excluded by the budget check.
run-name: "opencode-review-pr-${{ github.event.pull_request.number }}"

# Deny every token permission by default; the job asks for the reads it needs.
permissions: {}

# One review per pull request: a push cancels the review of the superseded head.
# Nothing is left behind by a cancelled run, because the comment is posted at
# the end, and a review of the old head is worth discarding. A re-run re-enters
# the same group, so `cancel-in-progress` is limited to the first attempt: a
# re-run must not cancel a newer review that is already running.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  preflight:
    # Drafts are skipped until they are ready for review. Forks are skipped:
    # they get a read-only token and no secrets, so the run could not reach the
    # model at all. The author allowlist below is what excludes
    # `release-please[bot]` and `dependabot[bot]`: their bodies are generated on
    # a schedule rather than written as a change to review.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      vars.OPENCODE_DISABLED != 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'agent-paused') &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'opencode-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of the preflight script on the default branch
      actions: read # list prior workflow runs for the per-PR budget
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      code: ${{ steps.check.outputs.code }}
      reason: ${{ steps.check.outputs.reason }}
      used: ${{ steps.check.outputs.used }}
      limit: ${{ steps.check.outputs.limit }}
      quota: ${{ steps.check.outputs.quota }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only a same-repository PR reaches this job (the `if` above), and a
          # contributor with a branch here already has write access. Checking
          # out the head lets a preflight change be reviewed before it reaches
          # the default branch; forks never run this job.
          fetch-depth: 1
          persist-credentials: false

      - name: Check provider quota and per-PR attempt budget
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REPO: ${{ github.repository }}
          BUDGET_KEY: "opencode-review-pr-${{ github.event.pull_request.number }}"
          BUDGET_WORKFLOW: opencode-review.yml
          BUDGET_LIMIT: ${{ vars.OPENCODE_REVIEW_BUDGET || 20 }}
          BUDGET_INCLUDE_SKIPPED: "false"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUOTA_PERCENT: ${{ vars.OPENCODE_PROVIDER_QUOTA_PERCENT || 95 }}
        run: node scripts/opencode-preflight.mjs --both

  review:
    needs: preflight
    if: needs.preflight.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the PR head
      id-token: write # OIDC exchange for the App token that posts the review
      pull-requests: read # gh pr view / gh pr diff
      issues: read # gh issue view for the linked ticket; PR comments are issues
      checks: read # gh pr checks
      statuses: read # commit statuses behind gh pr checks
      actions: read # gh run view for the workflow behind a failing check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the whitelisted `git log`, `git show` and
          # `git merge-base` need it, and the base branch has to be present.
          # The patch itself comes from `gh pr diff`; `git diff` stays off the
          # whitelist (see the permission block below).
          fetch-depth: 0
          persist-credentials: false

      # opencode.json reads the Render MCP token from .render-api-key, a
      # gitignored local secret. The config is rejected while that file is
      # missing, which is the case on a fresh runner, so create an empty
      # placeholder: the agent has no Render key, does not use the server, and
      # a failed MCP connection does not stop a run.
      #
      # The placeholder is kept out of git locally, whatever the reviewed PR
      # does to .gitignore, so a PR that unignores the file must not turn this
      # step into a commit on its own branch.
      - name: Provide the local config's secret file placeholder
        run: |
          echo '.render-api-key' >> .git/info/exclude
          touch .render-api-key

      # Same install path as the pinned action, without its event-driven runner
      # and its actor-permission check.
      - name: Install opencode
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Review with OpenCode
        id: agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Read-only token for the whitelisted `gh` calls. Naming it GH_TOKEN
          # is what makes `gh` pick it up; the job's GITHUB_TOKEN cannot write.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # `ask` cannot be answered on a runner: the tool call blocks until the
          # job timeout (#52). Everything the review needs is allowed; the rest
          # is denied, not asked. In the V1 `permission` object a rule is either
          # an action or a command map, and the last matching key wins, so the
          # wildcard comes first and the guards below come last. `edit` is denied
          # to keep the worktree clean, and the web is denied because the review
          # reads the PR, not links pasted into it.
          #
          # `read` needs a rule of its own because the base policy every agent
          # starts with *asks* on `read` of `*.env` and `*.env.*`. One env lookup
          # then blocks the run until the timeout, which is how #63 died, and a
          # secret has no place in a public review comment anyway.
          #
          # `git diff` is deliberately absent. Given two paths outside the
          # worktree it enters no-index mode by itself, with no flag to deny, and
          # then reads files `external_directory` is meant to keep out; the patch
          # comes from `gh pr diff` instead. The guards close the ways a
          # whitelisted command stops being read-only: a redirect (`>`, `2>`,
          # `&>`, `<<`) writes or reads a path the command never saw, and
          # `--output` makes git itself write.
          OPENCODE_PERMISSION: |
            {
              "edit": "deny",
              "read": {
                "*": "allow",
                "*.env": "deny",
                "*.env.*": "deny"
              },
              "external_directory": "deny",
              "question": "deny",
              "task": "deny",
              "todowrite": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "bash": {
                "*": "deny",
                "git status": "allow",
                "git status *": "allow",
                "git log *": "allow",
                "git show *": "allow",
                "git merge-base *": "allow",
                "git rev-parse *": "allow",
                "gh pr view *": "allow",
                "gh pr diff *": "allow",
                "gh pr checks *": "allow",
                "gh issue view *": "allow",
                "gh run view *": "allow",
                "*--output*": "deny",
                "*--no-index*": "deny",
                "*>*": "deny",
                "*<*": "deny",
                "*;*": "deny",
                "*&&*": "deny",
                "*&*": "deny",
                "*|*": "deny",
                "*$*": "deny",
                "*`*": "deny",
                "*\n*": "deny",
                "*\r*": "deny"
              }
            }
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          opencode run --model opencode-go/deepseek-v4.1-flash \
            > "$tmp/review.md" 2> "$tmp/agent.log" <<'PROMPT'
          Review pull request #${{ github.event.pull_request.number }} in
          ${{ github.repository }} and return the review as Markdown.

          Read AGENTS.md, CODING_STANDARDS.md, REVIEW.md and
          docs/agents/review.md before anything else. REVIEW.md holds the
          calendar/booking invariants; docs/agents/review.md is the contract:
          it defines the two axes, the evidence each finding needs, what to do
          with earlier review threads, and how to finish. Follow both.

          The pull request number is exported as $PR. Read the request with
          `gh pr view $PR --json number,title,body,baseRefName,headRefName,commits,files`,
          the patch with `gh pr diff $PR`, the earlier conversation with
          `gh pr view $PR --comments`, each linked ticket with `gh issue view`
          and the ticket number, and CI evidence with `gh pr checks $PR`,
          `gh run view` and the id from a failing check. When the description
          links a human approval comment, read it with `gh issue view <n>
          --comments`; if no approval is linked, report that gap.

          Shell access is limited to those read commands, and tools cannot
          edit, commit, push, approve, request changes or comment. Report;
          do not act.

          Never return an empty answer: a run with no text fails the job.
          PROMPT
          if [ ! -s "$tmp/review.md" ]; then
            printf 'No review produced.\n' > "$tmp/review.md"
          fi

      # Post the review through the App token: the job's GITHUB_TOKEN stays
      # read-only, so exchange a fresh OIDC token for the same App token
      # opencode.yml uses, then `gh pr comment` the agent's answer. Run only
      # after the agent succeeded, or a lone failure comment could be mistaken
      # for the review when the run produced none.
      - name: Post the review
        if: ${{ !cancelled() && steps.agent.outcome == 'success' }}
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          if [ ! -s "$tmp/review.md" ]; then
            echo "No review to post."
            exit 0
          fi
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          oidc_request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "$oidc_url" ] || [ -z "$oidc_request_token" ]; then
            echo "::error::OIDC is not available; id-token: write is required."
            exit 1
          fi
          oidc=$(curl -fsS \
            -H "Authorization: bearer $oidc_request_token" \
            "$oidc_url&audience=opencode-github-action" | jq -r .value)
          if [ -z "$oidc" ] || [ "$oidc" = null ]; then
            echo "::error::OIDC token request failed."
            exit 1
          fi
          app=$(curl -fsS -X POST \
            -H "Authorization: Bearer $oidc" \
            https://api.opencode.ai/exchange_github_app_token | jq -r .token)
          if [ -z "$app" ] || [ "$app" = null ]; then
            echo "::error::OpenCode App token exchange failed."
            exit 1
          fi
          echo "::add-mask::$app"
          export GH_TOKEN="$app"
          gh pr comment "$PR" --repo "$REPO" --body-file "$tmp/review.md"
          echo "Posted the review."

  refuse:
    needs: preflight
    if: |
      always() &&
      (needs.preflight.result == 'failure' ||
       needs.preflight.outputs.allowed == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # post the reason on the PR; this job has no model key
    steps:
      - name: Post the refusal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ needs.preflight.outputs.code || 'preflight' }}
          REASON: ${{ needs.preflight.outputs.reason || 'the preflight check did not allow this review' }}
          SHA: ${{ needs.preflight.outputs.sha || github.event.pull_request.head.sha }}
          USED: ${{ needs.preflight.outputs.used }}
          LIMIT: ${{ needs.preflight.outputs.limit }}
          QUOTA: ${{ needs.preflight.outputs.quota }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP:-/tmp}/refusal.md"
          {
            echo '**OpenCode review did not start.**'
            echo
            echo "- Reason code: \`${CODE}\`"
            printf '%s\n' "${REASON}"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Run: ${RUN_URL}"
            echo '- **Status: needs human.** Do not retry automatically; inspect the log before choosing the next action.'
            if [ -n "${USED:-}" ] && [ -n "${LIMIT:-}" ]; then
              echo "- Budget: ${USED}/${LIMIT} attempts used"
            fi
            if [ -n "${QUOTA:-}" ]; then
              echo "- Provider quota: ${QUOTA}"
            fi
            echo
            echo 'A human chooses the next action: raise the limit, wait for the provider window, or revise the request.'
          } > "$body"
          {
            echo '## OpenCode review stopped'
            echo
            cat "$body"
          } >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$PR" --repo "$REPO" --body-file "$body"
          echo "::error::${REASON}"
          exit 1

  report:
    # The preflight passed and the review was allowed to call the model. A
    # failure after that is classified without a model key: a timeout or
    # cancellation is `timeout`, a setup/transport step is `infra`, and an
    # agent-step failure is `agent_failed`.
    needs: [preflight, review]
    if: |
      always() &&
      needs.preflight.outputs.allowed == 'true' &&
      (needs.review.result == 'failure' || needs.review.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # inspect the review job's failed step
      issues: write # post the reason on the PR
    steps:
      - name: Classify and post the review failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ needs.preflight.outputs.sha || github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.review.result }}
          TIMEOUT_MINUTES: 15
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          reason=agent_failed
          if [ "$RESULT" = 'cancelled' ]; then
            reason=timeout
          else
            jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
            duration=$(printf '%s\n' "$jobs" | jq -r '
              .jobs[] | select(.name == "review")
              | if .completed_at and .started_at
                then ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))
                else 0 end
            ' | head -n 1)
            if [ "${duration:-0}" -ge $((TIMEOUT_MINUTES * 60 - 60)) ]; then
              reason=timeout
            else
              failed=$(printf '%s\n' "$jobs" | jq -r '
                .jobs[] | select(.name == "review") | .steps[]
                | select(.conclusion == "failure") | .name
              ' | head -n 1)
              case "${failed:-}" in
                "Checkout repository"|"Provide the local config's secret file placeholder"|"Install opencode"|"Post the review")
                  reason=infra
                  ;;
              esac
            fi
          fi

          body="${RUNNER_TEMP:-/tmp}/review-failure.md"
          {
            echo '**OpenCode review failed after the preflight passed.**'
            echo
            echo "- Reason code: \`${reason}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Run: ${RUN_URL}"
            echo '- **Status: needs human.** Do not retry automatically; inspect the log before choosing the next action.'
            echo
            if [ "$reason" = 'timeout' ]; then
              echo 'The review was cancelled or exceeded its time budget. Check the last step in the log.'
            elif [ "$reason" = 'infra' ]; then
              echo 'A setup or transport step failed before the review could be posted. Check the failed step and the toolchain.'
            else
              echo 'The agent step failed. Check the failed step and the model log; if the cause is unclear, treat it as agent_failed.'
            fi
          } > "$body"
          {
            echo '## OpenCode review failed'
            echo
            cat "$body"
          } >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$PR" --repo "$REPO" --body-file "$body"
          echo "::error::OpenCode review ${reason}"
          exit 1
