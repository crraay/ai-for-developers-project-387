name: opencode

# A comment that mentions /oc or /opencode — on an issue, a pull request, or a
# line of its diff — asks the agent to explain the thread, fix the issue, or
# review code. The comment body is used as data only: it is never interpolated
# into a shell command.
#
# `issue_comment` and `pull_request_review_comment` are dangerous triggers by
# design: anyone who can comment can start them, and `issue_comment` runs in the
# base repository with the job's secrets and token. A fork review comment gets
# no secrets (GitHub withholds them for that event) and the event guard below
# keeps it out of the key-holding job anyway. Both carry the comment, so the
# finding is accepted with one scoped, expiring exception in
# .github/jactionlint.yaml. The mitigations live here: the trigger is gated to
# a comment from the repository owner, the job's GITHUB_TOKEN cannot write (the
# boundary step reads with it), and the model key is read only by the budget
# and agent jobs. A write-capable token — the OpenCode App token, exchanged over
# OIDC before the agent runs — is handed to the agent as GH_TOKEN, so it can
# apply labels, file and close issues, push branches and open pull requests,
# while the workflow's own token stays read-only. The last step exchanges a
# fresh OIDC token for the App token because the action revokes its own in
# `finally`.
#
# Three controls are deliberately separate:
#   - `gate` is secret-free. It accepts only the repository owner's command on
#     a same-repository PR, and refuses a fork before any job can read
#     OPENCODE_API_KEY.
#   - `budget` checks the provider's own account-wide quota and the per-PR
#     attempt budget. It holds the model key, but only after the gate passed.
#   - `refuse` posts the reason, head SHA and run link when either check stops
#     the run. It has no model key.
# `concurrency` with `cancel-in-progress: false` only protects the running job:
# GitHub keeps one pending run by default, so `queue: max` preserves every
# command instead of replacing the waiting one.
#
# A comment on a code line is a message in that line's thread, not in the PR
# conversation. The pinned action already gives the agent the file, line and
# diff hunk (`getReviewCommentContext`), but answers with
# `issues.createComment`, so the last step moves the answer into the thread and
# deletes the top-level copy. That is a workaround for the action's transport,
# not its prompt; #54 replaces both.
#
# No human is present to answer a permission prompt. A permission that resolves
# to `ask` blocks the tool call until the job timeout, and the run ends without
# a reply (issue #52: `external_directory`, hit by a `tail` of opencode's own
# log). The agent step denies those permissions instead, so the model gets a
# tool error it can read and work around, and always reaches its reply step.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# The run name is the budget ledger key. It is stable across re-runs and
# comments on the same thread; skipped runs are excluded by the budget check.
run-name: "opencode-command-${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}-${{ github.event.issue.number || github.event.pull_request.number }}"

# Deny every token permission by default; the job asks for the three it needs.
permissions: {}

# One agent run per issue or pull request. A second /oc queues behind the first
# instead of working on the same checkout, and an in-flight run is never
# cancelled: its branch edits would stay behind while the run is gone. `queue:
# max` keeps up to 100 pending commands; without it GitHub's default queue
# would replace the second waiting command with the third.
# `issue.number` is set for issue_comment; review comments carry the PR number.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    # Bot comments are ignored so the agent cannot answer itself in a loop, and
    # only a comment from the repository owner starts a run. Matching the
    # commenter's login to github.repository_owner is stricter and more exact
    # than author_association: a collaborator's comment no longer runs the
    # agent, so the write-capable App token below only ever runs for the
    # owner's own command. The check happens before checkout, so no secret
    # reaches a runner for anyone else. This job has no model key at all; the
    # fork check runs before the budget job can read it.
    if: |
      vars.OPENCODE_DISABLED != 'true' &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event_name != 'issue_comment' || !contains(github.event.issue.labels.*.name, 'agent-paused')) &&
      (github.event_name != 'pull_request_review_comment' || !contains(github.event.pull_request.labels.*.name, 'agent-paused')) &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of the preflight script
      pull-requests: read # fork and head SHA lookup
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      reason: ${{ steps.gate.outputs.reason }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate never runs fork code: a review comment on a fork reads the
          # default branch. A same-repository review comment reads its own head
          # so a workflow change can be tested before it reaches the default
          # branch; that contributor already has write access.
          ref: ${{ (github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # A fork PR can reach this event through `issue_comment`, which runs in
      # the base repository with secrets. The gate resolves the PR head before
      # the budget job exists in the graph, so a fork never reaches a job that
      # can read OPENCODE_API_KEY.
      - name: Check the PR is in this repository
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DEFAULT_SHA: ${{ github.sha }}
        run: node scripts/opencode-preflight.mjs --gate

  budget:
    needs: gate
    # Defense in depth: the event payload is not modifiable by a fork, so a
    # review comment on a fork can never reach this job even if the PR-head
    # workflow file was edited to skip the gate.
    if: |
      needs.gate.outputs.allowed == 'true' &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of the preflight script
      actions: read # list prior workflow runs for the per-PR budget
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      reason: ${{ steps.check.outputs.reason }}
      used: ${{ steps.check.outputs.used }}
      limit: ${{ steps.check.outputs.limit }}
      quota: ${{ steps.check.outputs.quota }}
      sha: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same rule as the gate. This job holds the model key, so a fork
          # review comment reads the default branch; only a same-repository
          # review comment may read its own head.
          ref: ${{ (github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # Provider quota is account-wide; the run budget is per thread. Both are
      # checked before the model, and the model key is only read in this job
      # and the agent job (both behind `gate`).
      - name: Check provider quota and per-thread attempt budget
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REPO: ${{ github.repository }}
          BUDGET_KEY: "opencode-command-${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}-${{ github.event.issue.number || github.event.pull_request.number }}"
          BUDGET_WORKFLOW: opencode.yml
          BUDGET_LIMIT: ${{ vars.OPENCODE_RUN_BUDGET || 10 }}
          BUDGET_INCLUDE_SKIPPED: "false"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          QUOTA_PERCENT: ${{ vars.OPENCODE_PROVIDER_QUOTA_PERCENT || 95 }}
        run: node scripts/opencode-preflight.mjs --both

  opencode:
    needs: [gate, budget]
    if: |
      needs.gate.outputs.allowed == 'true' &&
      needs.budget.outputs.allowed == 'true' &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # mise install + setup + check + model time on implement runs
    permissions:
      contents: read # checkout of this repository
      id-token: write # OIDC exchange for the OpenCode App token
      issues: read # list the PR comments the action answers with
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # opencode.json reads the Render MCP token from .render-api-key, a
      # gitignored local secret. The config is rejected while that file is
      # missing, which is the case on a fresh runner, so create an empty
      # placeholder: the agent has no Render key, does not use the server, and
      # a failed MCP connection does not stop a run (checked against the
      # opencode 1.19.5 binary the action installs).
      - name: Provide the local config's secret file placeholder
        run: touch .render-api-key

      # Install the pinned toolchain (Java 25, node 24, the lint tools) so the
      # agent can run `mise run check` and friends when it implements. The only
      # build entry the whitelist below grants is `mise run`, which executes
      # tasks defined in mise.toml — never an arbitrary command. Cached, so a
      # triage/to-spec run pays only a cache hit.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      # The action answers a review comment as a top-level PR comment: at the
      # pinned SHA `createComment` calls `issues.createComment`, not
      # `pulls.createReplyForReviewComment`. Remember the newest comment before
      # the run so the answer posted by this run can be told apart from older
      # bot comments. Read-only: the job token lists, the App token writes.
      # A failure here must not stop the agent: the last step treats a missing
      # boundary as "leave the answer where the action put it".
      - name: Remember the newest PR comment
        if: github.event_name == 'pull_request_review_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          last=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].id' | sort -n | tail -n 1)
          printf '%s\n' "${last:-0}" > "$tmp/comment-boundary"

      # A write-capable token for the agent's own gh/git calls. It is the same
      # OpenCode App token the action exchanges for itself, obtained here before
      # the agent runs so the agent can apply labels, file and close issues,
      # push branches and open pull requests. The job's GITHUB_TOKEN stays
      # read-only, and the token is masked and short-lived. `continue-on-error`
      # degrades a failed exchange to an unauthenticated (read-only) agent
      # instead of stopping the run with no answer.
      - name: Exchange App token for the agent
        id: app-token
        continue-on-error: true
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          oidc_request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "$oidc_url" ] || [ -z "$oidc_request_token" ]; then
            echo "::error::OIDC is not available; id-token: write is required."
            exit 1
          fi
          oidc=$(curl -fsS \
            -H "Authorization: bearer $oidc_request_token" \
            "$oidc_url&audience=opencode-github-action" | jq -r .value)
          if [ -z "$oidc" ] || [ "$oidc" = null ]; then
            echo "::error::OIDC token request failed."
            exit 1
          fi
          app=$(curl -fsS -X POST \
            -H "Authorization: Bearer $oidc" \
            https://api.opencode.ai/exchange_github_app_token | jq -r .token)
          if [ -z "$app" ] || [ "$app" = null ]; then
            echo "::error::OpenCode App token exchange failed."
            exit 1
          fi
          echo "::add-mask::$app"
          echo "app-token=$app" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        id: agent
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest, 2026-11-13
        with:
          model: opencode-go/deepseek-v4.1-flash
          mentions: /oc,/opencode
          # The action shares the session by default on a public repo; turn it
          # off so agent transcripts are never published.
          share: "false"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # The write-capable App token exchanged above. Naming it GH_TOKEN is
          # what makes gh and git pick it up; the action's own OIDC path reads
          # GITHUB_TOKEN (and only when use_github_token is true), so this does
          # not change how the action posts the answer.
          GH_TOKEN: ${{ steps.app-token.outputs.app-token }}
          # Anything that would prompt is denied: `ask` cannot be answered on a
          # runner. The web, subagents, the TODO tool and anything outside the
          # checkout are denied, and shell access is limited to git, gh and the
          # pinned build tasks (`mise run`) with no redirects or command
          # chaining — the agent reads attacker-authored issue bodies and PR
          # diffs, so a write token must not be usable to run arbitrary
          # commands. `mise run` only executes tasks defined in mise.toml;
          # `mise exec`/`mise x`, bare `npm`/`gradlew` and everything else stay
          # denied. Shape is opencode's V1
          # `permission` object (the 1.19.x binary the action installs), merged
          # over opencode.json; the last matching key wins, so the wildcard
          # comes first and the guards come last.
          OPENCODE_PERMISSION: |
            {
              "edit": "allow",
              "write": "allow",
              "read": {
                "*": "allow",
                "*.env": "deny",
                "*.env.*": "deny"
              },
              "external_directory": "deny",
              "question": "deny",
              "task": "deny",
              "todowrite": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "bash": {
                "*": "deny",
                "git *": "allow",
                "gh *": "allow",
                "mise run *": "allow",
                "*>*": "deny",
                "*<*": "deny",
                "*--output*": "deny",
                "*--no-index*": "deny",
                "*;*": "deny",
                "*&&*": "deny"
              }
            }

      # Move the answer into the line's thread. A reply needs a write-capable
      # token, and the job's GITHUB_TOKEN stays read-only, so exchange a fresh
      # OIDC token for the same App token the action used. The action revokes
      # its own token in `finally`, before this step, so it cannot be reused.
      # Reply first, delete second: a failure leaves the action's top-level
      # comment in place rather than losing the answer. Run only after the
      # agent succeeded, or a lone auto-review comment could be mistaken for
      # the answer when the run posted none.
      - name: Answer in the review thread
        if: ${{ !cancelled() && steps.agent.outcome == 'success' && github.event_name == 'pull_request_review_comment' }}
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BOT: opencode-agent[bot]
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          boundary_file="$tmp/comment-boundary"
          if [ ! -s "$boundary_file" ]; then
            echo "No boundary from this run; leaving the answer where it is."
            exit 0
          fi
          boundary=$(cat "$boundary_file")

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          oidc_request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "$oidc_url" ] || [ -z "$oidc_request_token" ]; then
            echo "::error::OIDC is not available; id-token: write is required."
            exit 1
          fi
          oidc=$(curl -fsS \
            -H "Authorization: bearer $oidc_request_token" \
            "$oidc_url&audience=opencode-github-action" | jq -r .value)
          if [ -z "$oidc" ] || [ "$oidc" = null ]; then
            echo "::error::OIDC token request failed."
            exit 1
          fi
          app=$(curl -fsS -X POST \
            -H "Authorization: Bearer $oidc" \
            https://api.opencode.ai/exchange_github_app_token | jq -r .token)
          if [ -z "$app" ] || [ "$app" = null ]; then
            echo "::error::OpenCode App token exchange failed."
            exit 1
          fi
          echo "::add-mask::$app"
          export GH_TOKEN="$app"

          # Only move when exactly one new bot comment exists. The auto-review
          # posts as the same bot under a separate concurrency group: if one of
          # its comments lands in this window, picking the newest would put the
          # review in the thread and leave the real answer behind.
          answer_ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.id > $boundary) | select(.user.login == \"$BOT\") | .id" \
            | sort -n)
          if [ -z "$answer_ids" ]; then
            echo "The run posted no answer to move."
            exit 0
          fi
          count=$(printf '%s\n' "$answer_ids" | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::warning::Found $count new bot comments after the boundary; leaving them in place."
            exit 0
          fi
          answer_id=$answer_ids

          gh api "repos/$REPO/issues/comments/$answer_id" --jq .body > "$tmp/answer.md"
          if [ ! -s "$tmp/answer.md" ]; then
            echo "The answer is empty; leaving it where it is."
            exit 0
          fi
          jq -n --rawfile body "$tmp/answer.md" '{body: $body}' > "$tmp/answer.json"
          gh api --method POST \
            "repos/$REPO/pulls/$PR/comments/$COMMENT_ID/replies" \
            --input "$tmp/answer.json" > /dev/null
          gh api --method DELETE "repos/$REPO/issues/comments/$answer_id" > /dev/null
          echo "Moved the answer into the review thread."

  refuse:
    needs: [gate, budget]
    if: |
      always() &&
      (needs.gate.result == 'failure' ||
       needs.gate.outputs.allowed == 'false' ||
       (needs.gate.outputs.allowed == 'true' &&
        (needs.budget.result == 'failure' ||
         needs.budget.result == 'skipped' ||
         needs.budget.outputs.allowed == 'false')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # post the reason on the issue/PR; this job has no model key
    steps:
      - name: Post the refusal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REASON: ${{ needs.budget.outputs.reason || needs.gate.outputs.reason || 'the preflight check did not allow this run' }}
          SHA: ${{ needs.budget.outputs.sha || needs.gate.outputs.sha || github.sha }}
          USED: ${{ needs.budget.outputs.used }}
          LIMIT: ${{ needs.budget.outputs.limit }}
          QUOTA: ${{ needs.budget.outputs.quota }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP:-/tmp}/refusal.md"
          {
            echo '**OpenCode did not start.**'
            echo
            printf '%s\n' "${REASON}"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Run: ${RUN_URL}"
            if [ -n "${USED:-}" ] && [ -n "${LIMIT:-}" ]; then
              echo "- Budget: ${USED}/${LIMIT} attempts used"
            fi
            if [ -n "${QUOTA:-}" ]; then
              echo "- Provider quota: ${QUOTA}"
            fi
            echo
            echo 'Do not retry this command; raise the limit or wait for the provider window to reset.'
          } > "$body"
          {
            echo '## OpenCode run stopped'
            echo
            cat "$body"
          } >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$NUMBER" --repo "$REPO" --body-file "$body"
          echo "::error::${REASON}"
          exit 1
