# Lint exceptions. Repo rule (docs/adr/0004-quality-gates.md): one path, one
# rule, a written reason, a human decision; security-relevant ones expire.
ignores:
  # /oc is asked for in a comment on an issue, a PR or a code line;
  # issue_comment and pull_request_review_comment are the triggers that carry
  # the comment body. The workflow keeps GITHUB_TOKEN read-only (permissions: {}
  # at workflow level, contents/issues read and id-token write in the job) and
  # the OpenCode action refuses actors without admin/write; the remaining
  # exposure is the App token and the model key, which is why the entry expires
  # and must be renewed deliberately.
  - rule: dangerous-triggers
    file: .github/workflows/opencode.yml
    reason: >-
      issue_comment and pull_request_review_comment are the triggers that carry
      the /oc comment; the trigger is gated to the repository owner, the
      workflow's own GITHUB_TOKEN cannot write, and the write-capable OpenCode
      App token is exchanged over OIDC and handed to the agent as GH_TOKEN.
    expires: "2027-05-13"
  # The audit workflow installs the opencode CLI with the same
  # `curl -fsSL https://opencode.ai/install | bash` that the pinned
  # anomalyco/opencode/github action runs internally. opencode ships no
  # checksummed distribution; the SHA pin freezes the wrapper but the installer
  # still resolves `releases/latest`, so this path carries no more exposure than
  # the action the other workflows already trust. The remaining exposure is the
  # model key and the App token, which is why the entry expires.
  - rule: unverified-download
    file: .github/workflows/todo-fixme-audit.yml
    reason: >-
      The opencode installer is the only distribution channel and is the same
      script the pinned anomalyco/opencode/github action runs; there is no
      checksummed binary to verify against.
    expires: "2027-05-13"
  # Same as the todo-fixme-audit entry above: the OSV-Scanner audit installs the
  # opencode CLI the same way, so whoever controls the opencode release channel
  # controls the agent step only. The exposure is the model key and the issues
  # write scope, not the repository's code, which is why the entry expires.
  - rule: unverified-download
    file: .github/workflows/security.yml
    reason: >-
      The opencode installer is the only distribution channel and is the same
      script the pinned anomalyco/opencode/github action and the todo-fixme-audit
      workflow run; there is no checksummed binary to verify against.
    expires: "2027-05-13"
